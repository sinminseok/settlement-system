<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>
<body>

<div class="sub_main">
    <div class="container -container">
        <form id="signup-form" class="form">
            <h2 class="title">회원가입</h2>
            <input type="email" id="email" name="email" class="form__input" placeholder="이메일" required>
            <input type="password" id="password" name="password" class="form__input" placeholder="비밀번호" required>
            <select id="role" name="role" class="form__input" required>
                <option value="ADMIN">관리자</option>
                <option value="OWNER">소유자</option>
            </select>
            <button type="submit" class="button">Sign up</button>
            <a href="/auth/login" class="form__link">Login</a>
        </form>
    </div>
</div>

<script>
    document.getElementById('signup-form').addEventListener('submit', function(event) {
        event.preventDefault();  // 기본 제출 막기

        const formData = new FormData(this);
        const data = {
            email: formData.get('email'),
            password: formData.get('password'),
            role: formData.get('role')
        };

        fetch('/users', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            console.log('회원가입 성공:', result);
            window.location.href = '/auth/login';  // 성공 시 로그인 페이지 이동
        })
        .catch(error => {
            console.error('회원가입 실패:', error);
        });
    });
</script>

</body>
</html>
