<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/header :: header">
    <meta charset="UTF-8">
    <title>로그인</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/css/custom.css"> <!-- 추가적인 스타일링 가능 -->
</head>

<body>
<div class="container">
    <div th:replace="fragments/bodyHeader :: bodyHeader"></div>

    <div class="jumbotron mt-5 mx-auto text-center shadow" style="max-width: 800px; padding: 30px; border-radius: 10px;">
        <h2 class="title mb-3">정산 시스템 로그인</h2>
        <p class="text-muted">이메일과 비밀번호를 입력해주세요.</p>

        <form class="form" id="login-form">
            <div class="form-group mb-3"> <!-- 입력 필드 사이 여백 조정 -->
                <input type="email" id="email" name="email" class="form-control" placeholder="이메일" required>
            </div>

            <div class="form-group mb-3"> <!-- 입력 필드 사이 여백 조정 -->
                <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호" required>
            </div>

            <p id="error-message" class="alert alert-danger d-none" style="font-size: 12px;"></p>

            <button type="submit" class="btn btn-primary w-100" style="height: 60px;">로그인</button><!-- 버튼 너비 100% 설정 -->

            <div class="mt-3">
                <a href="/auth/register" class="text-decoration-none">회원가입</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault(); // 기본 제출 방지

        const formData = new FormData(this);
        const email = formData.get('email');
        const password = formData.get('password');

        fetch('/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({ email, password }),
            credentials: 'include'
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "/owners/owner_main";
            } else {
                return response.json();
            }
        })
        .then(data => {
            if (data && data.message) {
                const errorMessage = document.getElementById('error-message');
                errorMessage.textContent = data.message;
                errorMessage.classList.remove('d-none');
            }
        })
        .catch(error => {
            console.error('로그인 실패:', error);
            const errorMessage = document.getElementById('error-message');
            errorMessage.textContent = "로그인에 실패했습니다.";
            errorMessage.classList.remove('d-none');
        });
    });
</script>
</body>
</html>
