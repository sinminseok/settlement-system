<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" type="text/css" href="/css/style.css">
</head>

<body>
<div class="sub_main">
    <div class="container -container" id="login-container">
        <form class="form" id="login-form">
            <h2 class="title">정산 시스템 로그인</h2>
            <p class="description">이메일과 비밀번호를 입력해주세요.</p>

            <input type="email" id="email" name="email" class="form__input" placeholder="이메일" required>
            <input type="password" id="password" name="password" class="form__input" placeholder="비밀번호" required>

            <p id="error-message" class="form__span" style="color: red; font-size: 12px;"></p>

            <button type="submit" class="button">Login</button>

            <a href="/auth/register" class="form__link">Sign up</a>
        </form>
    </div>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault(); // 폼 기본 제출 방지

        const formData = new FormData(this);
        const email = formData.get('email');
        const password = formData.get('password');

        fetch('/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: new URLSearchParams({ email, password }),
            credentials: 'include'
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "/owner/owner_main";
            } else {
                return response.json();
            }
        })
        .then(data => {
            if (data && data.message) {
                document.getElementById('error-message').textContent = data.message;
            }
        })
        .catch(error => {
            console.error('로그인 실패:', error);
            document.getElementById('error-message').textContent = "로그인에 실패했습니다.";
        });
    });
</script>
</body>
</html>
