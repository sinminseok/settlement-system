<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매출 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="/js/script.js"></script>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar p-3">
            <ul class="nav flex-column">
                <li class="nav-item">
                    <button class="nav-link active btn w-100" id="settlement-btn">정산 정보</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link btn w-100" id="orders-btn">주문 조회</button>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div id="settlement-section" class="section py-4">
                <h2 class="mb-4">정산 정보</h2>
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <button id="prev-month" class="btn btn-outline-primary">&lt;</button>
                        <span id="current-month" class="fs-5">2025년 2월</span>
                        <button id="next-month" class="btn btn-outline-primary">&gt;</button>
                    </div>
                    <div class="calendar-grid mt-3">
                        <!-- 달력 날짜별 매출 정보 동적 생성 -->
                    </div>
                </div>
            </div>

            <div id="orders-section" class="section py-4 d-none">
                <h2 class="mb-4">주문 조회</h2>
                <div class="card p-3">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>주문번호</th>
                            <th>고객명</th>
                            <th>총 금액</th>
                            <th>주문 날짜</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${order.id}"></td>
                            <td th:text="${order.customerName}"></td>
                            <td th:text="${order.totalPrice}"></td>
                            <td th:text="${order.orderDate}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

</body>
</html>
